<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- STEP 1: Change the title. This is the text on the browser tab. -->
  <title>PUT YOUR NAME HERE</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================================================================
     THIS PAGE IS EMPTY ON PURPOSE. YOU ARE GOING TO BUILD IT.

     HOW THIS WORKS
     Everything below is a set of instructions written in comments.
     A comment is text the browser ignores. It is only a note to you.
     Comments start with     <!- -     and end with     - ->

     Under each instruction, type the HTML that it asks for.
     Use the class names EXACTLY as written. The class names are what
     connect your HTML to the style file, and the style file is what
     makes your site look finished.

     A TAG:              <h1>Hello</h1>
                          ^open      ^close

     A TAG WITH A CLASS: <div class="card">Hello</div>

     Save the file, then refresh your browser to see your changes.
     =================================================================== -->


<!-- ===================================================================
     STEP 2: THE NAVIGATION BAR (the menu that sticks to the top)

     Build a <nav> with class="nav". Inside it put:
       1. A <div class="logo"> with your first name or initials
       2. Three links: <a href="#about">About</a>
                       <a href="#hobbies">Hobbies</a>
                       <a href="#links">Links</a>
       3. A button:    <button class="theme-btn" onclick="switchTheme()">Dark</button>

     The # in a link means "jump to the part of this page that has
     that id". You will add those ids in the steps below.
     =================================================================== -->

<!-- YOUR NAV GOES HERE -->



<!-- ===================================================================
     STEP 3: THE HERO (the large area at the top with your name)

     Build a <header class="hero">. Inside it put a <div class="wrap">,
     and inside that put:
       1. <div class="eyebrow fade-in">        a short label, like STUDENT
       2. <h1 class="fade-in delay-1">         your full name
       3. <p class="tagline fade-in delay-2">  one sentence about you
       4. <div class="fade-in delay-3">        holding two buttons:
             <a href="#about" class="btn">About Me</a>
             <a href="#links" class="btn btn-ghost">My Links</a>

     "fade-in" makes something appear smoothly when the page loads.
     "delay-1" makes it wait its turn so they appear one after another.
     =================================================================== -->

<!-- YOUR HERO GOES HERE -->



<!-- ===================================================================
     STEP 4: THE ABOUT SECTION

     Build a <section class="section" id="about"> with a
     <div class="wrap"> inside it. The id="about" is what makes the
     nav link from Step 2 work.

     Inside the wrap:
       1. <h2 class="reveal">About</h2>
       2. <p class="sub reveal">      a short grey line under the heading
       3. <div class="card card-wide reveal"> containing a <p> with two
          or three sentences about yourself

     "reveal" makes something fade up when you scroll to it. You can
     put it on almost anything.
     =================================================================== -->

<!-- YOUR ABOUT SECTION GOES HERE -->



<!-- ===================================================================
     STEP 5: THE FACTS GRID (boxes side by side)

     Build another <section class="section"> with a <div class="wrap">.
     Inside:
       1. <h2 class="reveal">Quick Facts</h2>
       2. <div class="grid">  and inside the grid, four of these:

            <div class="card reveal">
              <h3>Grade</h3>
              <p>7th</p>
            </div>

     Make one card each for your grade, your favourite food, your
     favourite game, and the superpower you would pick.

     TIP: write ONE card, check that it works, THEN copy and paste it
     three times and change the words.
     =================================================================== -->

<!-- YOUR FACTS GRID GOES HERE -->



<!-- ===================================================================
     STEP 6: THE HOBBIES SECTION

     Build a <section class="section" id="hobbies"> with a
     <div class="wrap"> inside.
     Inside:
       1. <h2 class="reveal">Interests</h2>
       2. <div class="tags reveal">  and inside it, as many of these
          as you want:

            <span class="tag">Soccer</span>

     Add at least five. Then put your mouse over them.
     =================================================================== -->

<!-- YOUR HOBBIES SECTION GOES HERE -->



<!-- ===================================================================
     STEP 7: THE QUOTE

     Build a <section class="section"> with a <div class="wrap">.
     Inside it put:

       <blockquote class="quote reveal">
         Your favourite quote goes here.
         <span>Who said it</span>
       </blockquote>

     It can be from a movie, a song, a book, or you can write your own.
     =================================================================== -->

<!-- YOUR QUOTE GOES HERE -->



<!-- ===================================================================
     STEP 8: THE LINKS SECTION

     Build a <section class="section" id="links"> with a
     <div class="wrap"> inside.
     Inside:
       1. <h2 class="reveal">Links</h2>
       2. <p class="sub reveal">   a line saying these are sites you like
       3. <div class="grid">  with three cards. This time make each
          card a LINK instead of a div:

            <a href="https://scratch.mit.edu" class="card reveal">
              <h3>Coding</h3>
              <p>Scratch</p>
            </a>

     Every href must start with https:// or the link will not work.
     =================================================================== -->

<!-- YOUR LINKS SECTION GOES HERE -->



<!-- ===================================================================
     STEP 9: THE FOOTER (the very bottom of the page)

     Build a <footer class="footer"> with a <div class="wrap"> inside.
     Inside that put:

       <p>Built by YOUR NAME</p>
       <p>My first website, written from an empty file.</p>
     =================================================================== -->

<!-- YOUR FOOTER GOES HERE -->



<!-- ===================================================================
     STEP 10: TURN ON THE JAVASCRIPT

     This one line switches on the dark mode button and the scroll
     animations. It must be the LAST thing before </body>.

     Uncomment the line below by deleting the <!- - at the start and
     the - -> at the end.
     =================================================================== -->

<!-- <script src="script.js"></script> -->

</body>
</html>
